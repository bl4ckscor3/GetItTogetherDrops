plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.96'
}

version = "1.4"
group = "bl4ckscor3.mod.getittogetherdrops"

base {
	archivesName = 'getittogetherdrops-neoforge-1.21.7'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
	version = "21.7.23-beta"
	validateAccessTransformers = true

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			ideName = "GetItTogetherDrops " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
		}
	}

	mods {
		getittogetherdrops {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": "Get It Together, Drops!",
                "Specification-Vendor": "bl4ckscor3",
                "Specification-Version": "${version}",
                "Implementation-Title": "Get It Together, Drops!",
                "Implementation-Version": "${version}",
                "Implementation-Vendor": "bl4ckscor3"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}